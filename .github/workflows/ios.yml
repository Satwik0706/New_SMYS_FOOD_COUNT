name: iOS & Android Cloud Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build iOS Application (Xcode)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package iOS App & Android APK
        run: |
          mkdir -p build-output/ios
          mkdir -p build-output/android
          cp -r app/build/outputs/apk/ build-output/android/ || true
          cd build/DerivedData/Build/Products/Release-iphoneos/
          zip -r "$GITHUB_WORKSPACE/build-output/ios/SMYS_Food_Count_iOS.zip" "SMYS Food Count.app"

      - name: Upload iOS & Android Builds
        uses: actions/upload-artifact@v4
        with:
          name: SMYS_Food_Count_App_Builds
          path: build-output/
