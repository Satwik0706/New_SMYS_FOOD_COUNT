name: iOS & Android Cloud Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build iOS App for Appetize.io (Simulator)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphonesimulator \
                     -configuration Release \
                     -derivedDataPath build/DerivedDataSimulator \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Build iOS App for Physical Devices
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build/DerivedDataDevice \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package Builds for Appetize.io & Android
        run: |
          mkdir -p build-output/ios-appetize
          mkdir -p build-output/ios-device
          mkdir -p build-output/android
          
          cp -r app/build/outputs/apk/ build-output/android/ || true
          
          # Package Simulator Build for Appetize.io
          cd build/DerivedDataSimulator/Build/Products/Release-iphonesimulator/
          zip -r "$GITHUB_WORKSPACE/build-output/ios-appetize/SMYS_Food_Count_Appetize_Simulator.zip" "SMYS Food Count.app"
          
          # Package Physical Device Build
          cd "$GITHUB_WORKSPACE/build/DerivedDataDevice/Build/Products/Release-iphoneos/"
          zip -r "$GITHUB_WORKSPACE/build-output/ios-device/SMYS_Food_Count_Device.zip" "SMYS Food Count.app"

      - name: Upload iOS & Android Builds
        uses: actions/upload-artifact@v4
        with:
          name: SMYS_Food_Count_App_Builds
          path: build-output/
